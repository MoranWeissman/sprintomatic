<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { height: 100%; margin: 0; background: oklch(0.195 0.005 75); color: oklch(0.8 0.008 80); font: 15px system-ui, sans-serif; -webkit-app-region: drag; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  b { font-size: 14px; font-weight: 600; letter-spacing: 0.22em; color: oklch(0.92 0.008 80); }
  p { margin: 0; }
</style>
</head>
<body>
  <b>SPRINTOMATIC</b>
  <p id="msg">Starting the dashboard…</p>
  <script>
    const msg = new URLSearchParams(location.search).get('msg');
    if (msg) document.getElementById('msg').textContent = msg;
  </script>
</body>
</html>
